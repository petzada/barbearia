<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f0f10" />
    <title>Sem conexão</title>
    <style>
      /* Página estática do service worker: não depende do bundle nem de dados da pessoa. */
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 1rem;
        background: #0f0f10;
        color: #f5f5f4;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        text-align: center;
        line-height: 1.5;
      }
      main {
        max-width: 24rem;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 0.5rem;
      }
      p {
        color: #b9b9b4;
        margin: 0 0 1.25rem;
      }
      button {
        min-height: 44px;
        min-width: 44px;
        padding: 0.5rem 1.25rem;
        border: 0;
        border-radius: 0.75rem;
        background: #d6a84b;
        color: #14110a;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 3px solid #9bcbff;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Sem conexão</h1>
      <p>Não foi possível abrir o aplicativo agora. Confira a internet e tente de novo.</p>
      <button type="button" onclick="location.reload()">Tentar de novo</button>
    </main>
  </body>
</html>
