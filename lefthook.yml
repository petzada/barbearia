# Gates locais (notebook ou VM da nuvem). Instalação automática no `pnpm install` (script prepare).
# pre-commit: só os arquivos em stage (formatter + eslint com cache).
# pre-push: só o typecheck incremental. Testes relacionados (`pnpm test:related`) antes do PR;
# lint, testes completos e build ficam no CI.

pre-commit:
  parallel: true
  jobs:
    - name: prettier
      glob: "*.{js,mjs,cjs,ts,tsx,mts,cts,json,css}"
      run: pnpm exec prettier --write --ignore-unknown {staged_files}
      stage_fixed: true
    - name: eslint
      glob: "*.{js,mjs,cjs,ts,tsx,mts,cts}"
      run: pnpm exec eslint --cache --cache-location node_modules/.cache/eslint/ {staged_files}

pre-push:
  jobs:
    - name: typecheck
      run: pnpm typecheck
