name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Um run por PR (ou por ref); push novo cancela o anterior.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  lint-build:
    name: lint, typecheck e build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Cache do Next (.next/cache)
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**', 'next.config.ts', 'tsconfig.json') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            next-${{ runner.os }}-

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # Mesmo build do Workers Builds (OpenNext) + dry-run do wrangler: o deploy da main não
      # pode ser o primeiro lugar onde o bundle com pnpm é gerado.
      - name: Build OpenNext (como o Workers Builds)
        run: pnpm cf:build

      - name: Wrangler dry-run
        run: pnpm exec wrangler deploy --dry-run --outdir .wrangler/dry

      - name: Aviso de falha
        if: failure()
        run: echo "::error title=CI falhou::lint, typecheck ou build falhou em ${{ github.ref_name }} (${{ github.sha }})."

  test:
    name: testes (unidade e D1)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Testes
        run: pnpm test:ci

      - name: Aviso de falha
        if: failure()
        run: echo "::error title=Testes falharam::vitest falhou em ${{ github.ref_name }} (${{ github.sha }})."

  # Check obrigatório da proteção da main: não renomear. Passa só se os dois jobs passarem.
  check:
    needs: [lint-build, test]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Resultado
        run: |
          echo "lint-build: ${{ needs.lint-build.result }} / test: ${{ needs.test.result }}"
          test "${{ needs.lint-build.result }}" = success && test "${{ needs.test.result }}" = success
